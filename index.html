
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mones Moment creates tools and technology for music, creativity and live performance.">
  <title>Mones Moment — Music, Creativity & Technology</title>
  <style>
    :root {
      --background: #101416;
      --surface: #192124;
      --text: #f1f4f4;
      --muted: #a5b2b5;
      --accent: #418c9e;
      --highlight: #ffe84a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 8%;
      border-bottom: 1px solid #263236;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .logo span {
      color: var(--accent);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--highlight);
    }

    .language {
      color: var(--text);
      border: 1px solid #354448;
      border-radius: 20px;
      padding: 6px 12px;
    }

    main {
      min-height: 75vh;
      display: flex;
      align-items: center;
      padding: 100px 8%;
    }

    .hero {
      max-width: 850px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 1.05;
      letter-spacing: -0.055em;
      margin-bottom: 30px;
    }

    h1 span {
      color: var(--accent);
    }

    .intro {
      max-width: 620px;
      color: var(--muted);
      font-size: 1.2rem;
      margin-bottom: 42px;
    }

    .button {
      display: inline-block;
      background: var(--highlight);
      color: #101416;
      padding: 13px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    footer {
      padding: 28px 8%;
      border-top: 1px solid #263236;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 6%;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 0.8rem;
      }

      main {
        padding: 80px 6%;
      }

      .intro {
        font-size: 1.05rem;
      }

      footer {
        padding: 24px 6%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">MONES <span>MOMENT</span></div>
    <nav>
      <a href="#about">About</a>
      <a href="#products">Products</a>
      <a class="language" href="/es/">🇦🇷 ES</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="about">
      <p class="eyebrow">Music · Creativity · Technology</p>
      <h1>Technology for<br>creative <span>moments.</span></h1>
      <p class="intro">
        Mones Moment develops tools and technology that connect creativity,
        music and digital experiences.
      </p>
      <a class="button" href="/cue-controller">
        Explore Cue Controller
      </a>
    </section>
  </main>

  <footer>
    <span>© 2026 Mones Moment</span>
    <span>Independent technology & creative tools</span>
  </footer>
</body>
</html>
